name: Compilar documentos

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/primeiro-mvp-documentos
      - feat/nucleo-documental
    paths:
      - "documentos/**"
      - "exemplos/**"
      - "filtros/**"
      - "nucleo/**"
      - "perfis/**"
      - "kit/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/compilar-documentos.yml"
  pull_request:
    branches:
      - main
    paths:
      - "documentos/**"
      - "exemplos/**"
      - "filtros/**"
      - "nucleo/**"
      - "perfis/**"
      - "kit/**"
      - "docs/**"
      - "schemas/**"
      - "scripts/**"
      - "templates/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/compilar-documentos.yml"

permissions:
  contents: read

jobs:
  validar-e-compilar:
    name: Validar e gerar documentos
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências Python
        run: pip install --requirement requirements.txt

      - name: Instalar Pandoc e XeLaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc texlive-xetex texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic poppler-utils
          pandoc --version
          xelatex --version

      - name: Executar testes
        run: |
          python - <<'PY'
          import sys
          import unittest

          resultado = unittest.TextTestRunner(verbosity=2).run(
              unittest.defaultTestLoader.discover("tests")
          )
          # As anotações preservam o diagnóstico mesmo sem acesso aos logs.
          for teste, detalhe in resultado.failures + resultado.errors:
              mensagem = detalhe.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              titulo = str(teste).replace("%", "%25").replace(",", "%2C").replace(":", "%3A")
              print(f"::error title={titulo}::{mensagem}", flush=True)
          sys.exit(0 if resultado.wasSuccessful() else 1)
          PY

      - name: Validar documentos
        run: python scripts/renderizar.py --validar-apenas

      - name: Validar modelos iniciais do kit
        run: python scripts/renderizar.py kit/modelos/*.md --validar-apenas

      - name: Compilar documentos
        run: python scripts/renderizar.py --formato tex,pdf

      - name: Verificar DOCX dos modelos anteriores
        run: python scripts/renderizar.py exemplos/atividade-usinagem.md exemplos/nota-aula-metrologia.md --formato docx

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: documentos-gerados
          path: dist/
          if-no-files-found: error
          retention-days: 14
