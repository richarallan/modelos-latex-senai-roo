name: Verificação de CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificar-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Sintaxe, testes e estrutura
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências de verificação
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q scripts tests

      - name: Executar testes unitários
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validar workflows YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflows = sorted(Path(".github/workflows").glob("*.y*ml"))
          if not workflows:
              raise SystemExit("Nenhum workflow YAML encontrado.")

          for workflow in workflows:
              conteudo = yaml.safe_load(workflow.read_text(encoding="utf-8"))
              if not isinstance(conteudo, dict):
                  raise SystemExit(f"Workflow inválido: {workflow}")
              print(f"YAML válido: {workflow}")
          PY
